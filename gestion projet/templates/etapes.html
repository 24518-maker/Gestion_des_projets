{% extends "base.html" %}
{% block title %}Étapes{% endblock %}
{% block content %}
<style>
.page-title {
  font-size: 26px;
  font-weight: 600;
  color: #2c3e50;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-add {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: linear-gradient(90deg,#A8E6CF,#56CFE1);
  color: white;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 500;
  box-shadow: 0 6px 18px rgba(86,207,225,0.25);
  transition: 0.3s;
}

.btn-add:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(86,207,225,0.35);
}

.table-container {
  margin-top: 18px;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

table {
  width: 100%;
  border-collapse: collapse;
}
thead tr {
  background: linear-gradient(90deg,#e9f7f5,#dff6f0);
}
th {
  padding: 14px;
  text-align: left;
  font-weight: 600;
  color: #2c3e50;
}

td {
  padding: 14px;
  font-size: 14px;
  color: #34495e;
}

tbody tr {
  transition: 0.25s;
  border-bottom: 1px solid #f0f0f0;
}

tbody tr:hover {
  background: #DFF6F0;
  transform: scale(1.01);
}

.project-badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(86,207,225,0.15);
  color: #56CFE1;
  font-size: 12px;
  font-weight: 500;
}

.edit {
  color: #2980b9;
  text-decoration: none;
  font-weight: 500;
  margin-right: 10px;
}

.edit:hover {
  opacity: 0.7;
}

.delete {
  color: #e74c3c;
  text-decoration: none;
  font-weight: 500;
}
.delete:hover {
  opacity: 0.7;
}
.empty {
  text-align: center;
  padding: 20px;
  color: #7f8c8d;
}

</style>

<h2 class="page-title">Étapes</h2>

<a href="{{ url_for('add_etape_page') }}" class="btn-add">
  ➕ Ajouter Étape
</a>

<div class="table-container">

<table>

  <thead>
    <tr>
      <th>Nom Étape</th>
      <th>Projet</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>

    {% for etape in etapes %}
    <tr>

      <td>{{ etape.Nom_etape }}</td>

      <td>
        <span class="project-badge">
          {{ etape.Nom_projet }}
        </span>
      </td>

      <td>
        <a class="edit"
           href="{{ url_for('update_etape_page', Id_etape=etape.Id_etape) }}">
          ✏ Edit
        </a>

        <a class="delete"
           href="{{ url_for('delete_etape_page', Id_etape=etape.Id_etape) }}">
          🗑 Delete
        </a>
      </td>

    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
